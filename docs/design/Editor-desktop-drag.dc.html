<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor, desktop, dragging a chord</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;icon_names=add,arrow_downward,arrow_upward,help,info&amp;display=block">
<style>
:root{--page:#EBF0EB;--surface-active:#FFFFFF;--text:#171D1A;--chord:#1F6B4F;--accent:#1F6B4F;--on-accent:#FFFFFF;--accent-soft:#C8E9D6;--on-accent-soft:#0A5138;--shadow:rgba(23,29,26,0.16)}
body{margin:0;background:var(--page)}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-size:24px;line-height:1;font-variation-settings:'FILL' 0,'opsz' 24;font-feature-settings:'liga';display:inline-block;white-space:nowrap}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end}
.w{display:inline-flex;flex-direction:column;white-space:pre;font-size:20px;line-height:1.45}
.c{height:21px;font-weight:700;font-size:15px;line-height:21px;color:var(--chord)}
.drop{position:relative}
.drop::before{content:"";position:absolute;left:-1px;top:-22px;bottom:4px;width:2px;border-radius:1px;background:var(--chord)}
.ghost{position:absolute;left:10px;top:-44px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;line-height:21px;box-shadow:0 6px 16px var(--shadow)}
</style>
</helmet>
<div style="width: 900px; height: 420px; box-sizing: border-box; padding: 40px 32px; background: var(--page); color: var(--text); font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: start">
  <div style="display: flex; justify-content: flex-end; padding-right: 16px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border-radius: 999px; background: var(--accent-soft)">
      <button type="button" aria-label="Add chord" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border: 0; border-radius: 28px; background: var(--accent); color: var(--on-accent)"><span class="ms" aria-hidden="true" style="font-size: 28px; font-variation-settings: 'FILL' 1, 'opsz' 28">add</span></button>
      <button type="button" aria-label="Move section up" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: var(--on-accent-soft)"><span class="ms" aria-hidden="true">arrow_upward</span></button>
      <button type="button" aria-label="Move section down" disabled style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: var(--on-accent-soft); opacity: 0.38"><span class="ms" aria-hidden="true">arrow_downward</span></button>
    </div>
  </div>
  <section style="display: grid; grid-template-columns: 52px minmax(0, 1fr); padding: 24px 28px 30px 20px; border-radius: 28px; background: var(--surface-active)">
    <div style="padding-top: 18px"><div style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15px">2</div></div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="ln"><span class="w"><span class="c"></span>'Twas </span><span class="w"><span class="c">G</span>grace that </span><span class="w"><span class="c">G7</span>taught my </span><span class="w"><span class="c"></span><span>heart <span class="drop"><span class="ghost">Cmaj7</span></span>to </span></span><span class="w"><span class="c">G</span>fear</span></div>
      <div class="ln"><span class="w"><span class="c"></span>And grace my fears re</span><span class="w"><span class="c">D</span>lieved</span></div>
      <div class="ln"><span class="w"><span class="c"></span>How </span><span class="w"><span class="c">G</span>precious </span><span class="w"><span class="c">G7</span>did that </span><span class="w"><span class="c">C</span>grace ap</span><span class="w"><span class="c">G</span>pear</span></div>
      <div class="ln"><span class="w"><span class="c"></span>The </span><span class="w"><span class="c">Em</span>hour I </span><span class="w"><span class="c">D</span>first be</span><span class="w"><span class="c">G</span>lieved</span></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
