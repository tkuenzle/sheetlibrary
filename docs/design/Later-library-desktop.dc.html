<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, desktop (sketch)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;icon_names=add,search&amp;display=block">
<style>
:root{--page:#EBF0EB;--surface:#F6FAF6;--surface-active:#FFFFFF;--text:#171D1A;--text-muted:#404943;--accent:#1F6B4F;--on-accent:#FFFFFF;--accent-soft:#C8E9D6;--on-accent-soft:#0A5138;--quiet:#DCE4DD;--border:#DCE4DD}
body{margin:0;background:var(--page)}
.ms{font-family:'Material Symbols Rounded';font-weight:500;font-size:24px;line-height:1;font-variation-settings:'FILL' 0,'opsz' 24;font-feature-settings:'liga';display:inline-block;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) 180px 64px;align-items:center;gap:16px;min-height:64px;padding:0 20px;border-radius:20px}
.key{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--on-accent-soft);font-weight:600;font-size:13px}
</style>
</helmet>
<div style="min-height: 800px; background: var(--page); color: var(--text); font-family: 'Schibsted Grotesk', system-ui, sans-serif">
  <header style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 24px">
    <a href="#" style="font-weight: 800; font-size: 20px; letter-spacing: -0.03em; color: var(--text); text-decoration: none">Sheet Library</a>
    <span style="margin-left: auto; padding: 4px 10px; border-radius: 999px; outline: 1px dashed #B0479A; font-weight: 500; font-size: 13px; color: #9C3C88">Rough sketch of a later screen</span>
  </header>
  <main style="max-width: 880px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-weight: 800; font-size: 46px; letter-spacing: -0.035em; line-height: 1.05">Library</h1>
      <button type="button" style="margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 15px 'Schibsted Grotesk', system-ui, sans-serif"><span class="ms" aria-hidden="true" style="font-variation-settings: 'FILL' 1, 'opsz' 24">add</span>New sheet</button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-radius: 26px; background: var(--surface-active); color: var(--text-muted)"><span class="ms" aria-hidden="true">search</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span><input placeholder="Search titles and lyrics" style="flex: 1; border: 0; outline: 0; background: transparent; font: 400 16px 'Schibsted Grotesk', system-ui, sans-serif; color: var(--text)"></label>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div class="row" style="min-height: 36px; font-weight: 600; font-size: 13px; color: var(--text-muted)"><span>Title</span><span>Words</span><span>Key</span></div>
      <a href="#" class="row" style="background: var(--surface-active); color: var(--text); text-decoration: none"><span style="font-weight: 700; font-size: 17px">Amazing Grace</span><span style="font-size: 15px; color: var(--text-muted)">John Newton</span><span class="key">G</span></a>
      <a href="#" class="row" style="background: var(--surface-active); color: var(--text); text-decoration: none"><span style="font-weight: 700; font-size: 17px">Be Thou My Vision</span><span style="font-size: 15px; color: var(--text-muted)">Traditional</span><span class="key">D</span></a>
      <a href="#" class="row" style="background: var(--surface-active); color: var(--text); text-decoration: none"><span style="font-weight: 700; font-size: 17px">Shenandoah</span><span style="font-size: 15px; color: var(--text-muted)">Traditional</span><span class="key">C</span></a>
      <a href="#" class="row" style="background: var(--surface-active); color: var(--text); text-decoration: none"><span style="font-weight: 700; font-size: 17px">The Water Is Wide</span><span style="font-size: 15px; color: var(--text-muted)">Traditional</span><span class="key">A</span></a>
      <a href="#" class="row" style="background: var(--surface-active); color: var(--text); text-decoration: none"><span style="font-weight: 700; font-size: 17px">Wayfaring Stranger</span><span style="font-size: 15px; color: var(--text-muted)">Traditional</span><span class="key">Dm</span></a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
