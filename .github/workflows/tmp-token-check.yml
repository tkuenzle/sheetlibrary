name: Temporary PR token check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: preview
      deployment: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload to the production worker must fail
        run: |
          pnpm --filter web build
          if pnpm --filter web exec wrangler versions upload; then
            echo "FAIL: PR token could upload to sheetlibrary"; exit 1
          fi
          echo "OK: upload to sheetlibrary rejected"
      - name: DNS changes must be rejected
        run: |
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/4bab627e8b880d13b5cd85ce231fd42e/dns_records/00000000000000000000000000000000")
          echo "HTTP $code: $(cat /tmp/r.json)"
          test "$code" = "403" || { echo "FAIL: expected 403"; exit 1; }
          echo "OK: DNS change rejected"
