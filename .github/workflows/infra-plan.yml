name: Infra plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "justfile"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read

jobs:
  plan:
    name: OpenTofu plan
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Repo-level secrets: read-only on zone, DNS, Workers and the state bucket.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
      - uses: extractions/setup-just@v4
      - run: just tofu-init
      # -lock=false: the read-only state keys can't write a lock.
      - run: just tofu-plan -lock=false -no-color
